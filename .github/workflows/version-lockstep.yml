name: Version Lockstep

# Comprehensive version lockstep gate.
# Verifies all 12 version-carrying files across cli/, admin/, and homebrew-nself/
# match the canonical version in cli/.github/VERSION (or the pushed tag on a release).
#
# On a pull_request: checks the files changed in the PR against VERSION.
# On a push to main:  checks all 12 files.
# On a tag push:      treats the tag as the authoritative version.
#
# Complements:
#   sdk-version-sync.yml          — SDK-only check (go/ts/py/flutter)
#   homebrew-version-lockstep.yml — homebrew-only check on tag push
#   admin/.github/workflows/version-lockstep.yml — admin-internal check
#
# This workflow is the single comprehensive gate that covers ALL 12 files.
# It runs the lockstep check script directly rather than reimplementing logic.
#
# Authority: P98 S98-02 T04; bump-version.md

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    paths:
      - '.github/VERSION'
      - 'internal/version/version.go'
      - 'sdk/go/doc.go'
      - 'sdk/ts/package.json'
      - 'sdk/py/pyproject.toml'
      - 'sdk/flutter/pubspec.yaml'
      - '.github/workflows/version-lockstep.yml'
      - 'scripts/check-version-lockstep.sh'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lockstep:
    name: Verify all 12 version files are in lockstep
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout cli
        uses: actions/checkout@v4
        with:
          path: cli

      - name: Checkout admin
        uses: actions/checkout@v4
        with:
          repository: nself-org/admin
          token: ${{ secrets.GITHUB_TOKEN }}
          path: admin

      - name: Checkout homebrew-nself
        uses: actions/checkout@v4
        with:
          repository: nself-org/homebrew-nself
          token: ${{ secrets.GITHUB_TOKEN }}
          path: homebrew-nself

      - name: Resolve target version
        id: target
        run: |
          # On tag push, version is the tag (strip 'v').
          # On branch push or PR, version is the contents of VERSION.
          if printf '%s' "${GITHUB_REF}" | grep -q '^refs/tags/v'; then
            TARGET="${GITHUB_REF#refs/tags/v}"
            echo "Source: tag ${GITHUB_REF}"
          else
            TARGET="$(cat cli/.github/VERSION)"
            echo "Source: cli/.github/VERSION"
          fi
          printf 'target=%s\n' "${TARGET}" >> "$GITHUB_OUTPUT"
          printf 'Target version: %s\n' "${TARGET}"

      - name: Run comprehensive lockstep check
        env:
          NSELF_REPO_ROOT: ${{ github.workspace }}/cli
          NSELF_ADMIN_ROOT: ${{ github.workspace }}/admin
          NSELF_HB_ROOT: ${{ github.workspace }}/homebrew-nself
          TARGET: ${{ steps.target.outputs.target }}
        run: |
          set -euo pipefail

          ERRORS=0
          WARNINGS=0

          check() {
            local label="$1"
            local got="$2"
            local required="${3:-1}"

            if [ -z "${got}" ]; then
              if [ "${required}" -eq 1 ]; then
                printf '::error::%s: could not parse version\n' "${label}"
                ERRORS=$((ERRORS + 1))
              else
                printf '::warning::%s: could not parse version (warn-only)\n' "${label}"
                WARNINGS=$((WARNINGS + 1))
              fi
              return
            fi

            if [ "${got}" = "${TARGET}" ]; then
              printf '  OK  %s == %s\n' "${label}" "${got}"
            else
              if [ "${required}" -eq 1 ]; then
                printf '::error::%s: expected %s, got %s\n' "${label}" "${TARGET}" "${got}"
                ERRORS=$((ERRORS + 1))
              else
                printf '::warning::%s: expected %s, got %s (warn-only)\n' "${label}" "${TARGET}" "${got}"
                WARNINGS=$((WARNINGS + 1))
              fi
            fi
          }

          printf 'Checking all 12 lockstep files against target version: %s\n\n' "${TARGET}"

          # 1. cli/internal/version/version.go
          V=$(grep -E '^\s+Version\s+string\s*=' "${NSELF_REPO_ROOT}/internal/version/version.go" \
                | grep -oE '"[0-9]+\.[0-9]+\.[0-9]+"' | tr -d '"' | head -1)
          check "cli/internal/version/version.go" "${V}" 1

          # 2. cli/.github/VERSION
          V=$(cat "${NSELF_REPO_ROOT}/.github/VERSION" 2>/dev/null | tr -d '[:space:]')
          check "cli/.github/VERSION" "${V}" 1

          # 3. cli/sdk/go/doc.go
          V=$(grep -E 'const Version\s*=' "${NSELF_REPO_ROOT}/sdk/go/doc.go" \
                | grep -oE '"[0-9]+\.[0-9]+\.[0-9]+"' | tr -d '"' | head -1)
          check "cli/sdk/go/doc.go" "${V}" 1

          # 4. cli/sdk/ts/package.json
          V=$(node -p "require('${NSELF_REPO_ROOT}/sdk/ts/package.json').version")
          check "cli/sdk/ts/package.json" "${V}" 1

          # 5. cli/sdk/py/pyproject.toml
          V=$(grep -E '^version\s*=' "${NSELF_REPO_ROOT}/sdk/py/pyproject.toml" \
                | grep -oE '"[0-9]+\.[0-9]+\.[0-9]+"' | tr -d '"' | head -1)
          check "cli/sdk/py/pyproject.toml" "${V}" 1

          # 6. cli/sdk/flutter/pubspec.yaml
          V=$(grep -E '^version:' "${NSELF_REPO_ROOT}/sdk/flutter/pubspec.yaml" \
                | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          check "cli/sdk/flutter/pubspec.yaml" "${V}" 1

          # 7. admin/package.json
          V=$(node -p "require('${NSELF_ADMIN_ROOT}/package.json').version")
          check "admin/package.json" "${V}" 1

          # 8. admin/src/lib/cli-version.ts
          V=$(grep -E "CLI_VERSION\s*=\s*'" "${NSELF_ADMIN_ROOT}/src/lib/cli-version.ts" \
                | grep -oE "'[0-9]+\.[0-9]+\.[0-9]+'" | tr -d "'" | head -1)
          check "admin/src/lib/cli-version.ts" "${V}" 1

          # 9. admin/Dockerfile ARG NSELF_VERSION
          V=$(grep -E '^ARG NSELF_VERSION=' "${NSELF_ADMIN_ROOT}/Dockerfile" \
                | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          check "admin/Dockerfile (ARG NSELF_VERSION)" "${V}" 1

          # 10. admin/Dockerfile ENV ADMIN_VERSION
          V=$(grep -E '^ENV ADMIN_VERSION=' "${NSELF_ADMIN_ROOT}/Dockerfile" \
                | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          check "admin/Dockerfile (ENV ADMIN_VERSION)" "${V}" 1

          # 11. admin/Dockerfile LABEL image.version
          V=$(grep -E 'org.opencontainers.image.version=' "${NSELF_ADMIN_ROOT}/Dockerfile" \
                | grep -oE '"[0-9]+\.[0-9]+\.[0-9]+"' | tr -d '"' | head -1)
          check "admin/Dockerfile (LABEL image.version)" "${V}" 1

          # 12. homebrew-nself/Formula/nself.rb (warn-only)
          if [ -f "${NSELF_HB_ROOT}/Formula/nself.rb" ]; then
            V=$(grep -E '^\s+version\s+"' "${NSELF_HB_ROOT}/Formula/nself.rb" \
                  | grep -oE '"[0-9]+\.[0-9]+\.[0-9]+"' | tr -d '"' | head -1)
            if [ -z "${V}" ]; then
              V=$(grep -E 'url.*v[0-9]+\.[0-9]+\.[0-9]+' "${NSELF_HB_ROOT}/Formula/nself.rb" \
                    | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | tr -d 'v' | head -1)
            fi
            check "homebrew-nself/Formula/nself.rb" "${V}" 0
          else
            printf '  SKIP  homebrew-nself/Formula/nself.rb (checkout not available)\n'
          fi

          printf '\n'
          if [ "${ERRORS}" -gt 0 ]; then
            printf '::error::VERSION LOCKSTEP FAILED: %d error(s), %d warning(s)\n' \
              "${ERRORS}" "${WARNINGS}"
            printf '\n'
            printf 'Fix: run  scripts/bump-version.sh %s  from the cli repo to synchronise all files.\n' \
              "${TARGET}"
            exit 1
          fi

          if [ "${WARNINGS}" -gt 0 ]; then
            printf 'Version lockstep OK (required files): v%s  [%d warning(s)]\n' \
              "${TARGET}" "${WARNINGS}"
          else
            printf 'Version lockstep OK: all files == v%s\n' "${TARGET}"
          fi

  # Summary job — provides a single status check named "Version Lockstep / summary"
  # for branch protection rules to require.
  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [lockstep]
    if: always()
    steps:
      - name: Report status
        run: |
          STATUS="${{ needs.lockstep.result }}"
          if [ "${STATUS}" = "success" ]; then
            echo "Version lockstep passed."
          elif [ "${STATUS}" = "skipped" ]; then
            echo "Version lockstep skipped (no matching paths changed)."
          else
            echo "Version lockstep FAILED — see lockstep job above."
            exit 1
          fi

name: CI Failure Alert

# S204-T04: Send Slack alert when main goes red on any of the 11 nSelf repos.
# Each repo must add this workflow (or call this one via workflow_call).
# This instance guards cli/main only. Other repos get their own copy via T04.
on:
  workflow_run:
    workflows:
      - CI
      - Test
      - Release
      - Flutter CI
      - Android Build & Play Store
    types:
      - completed
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  alert-on-failure:
    name: Alert — main CI failure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    steps:
      # G14-CI-FIX: guard against missing SLACK_WEBHOOK secret so the workflow
      # itself does not go red when Slack is not yet configured.  When the
      # secret is absent the step is skipped with a clear notice instead of
      # failing the workflow and hiding the real CI failure underneath.
      - name: Check Slack webhook configured
        id: slack-check
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK secret not set — skipping Slack alert (set secrets.SLACK_WEBHOOK to enable)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

      - name: Send Slack alert
        if: ${{ steps.slack-check.outputs.skip == 'false' }}
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          custom_payload: |
            {
              "text": ":red_circle: *CI failure on main*",
              "attachments": [
                {
                  "color": "danger",
                  "fields": [
                    {
                      "title": "Repo",
                      "value": "${{ github.repository }}",
                      "short": true
                    },
                    {
                      "title": "Workflow",
                      "value": "${{ github.event.workflow_run.name }}",
                      "short": true
                    },
                    {
                      "title": "Run",
                      "value": "<${{ github.event.workflow_run.html_url }}|View run>",
                      "short": true
                    },
                    {
                      "title": "Branch",
                      "value": "${{ github.event.workflow_run.head_branch }}",
                      "short": true
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

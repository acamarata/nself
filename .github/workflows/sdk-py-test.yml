name: SDK Python Tests

on:
  push:
    paths:
      - 'sdk/py/**'
  pull_request:
    paths:
      - 'sdk/py/**'

jobs:
  sdk-py:
    name: Python SDK Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies and run tests
        run: |
          cd sdk/py
          pip install -e ".[dev]"
          pytest

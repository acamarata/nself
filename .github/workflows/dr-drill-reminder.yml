# DR Drill Quarterly Reminder — S9.T12
# Creates a GitHub issue on the first Monday of each quarter as a drill reminder.
# Drills are tracked in .claude/docs/operations/dr-drills-calendar.md

name: DR Drill Quarterly Reminder

on:
  schedule:
    # First Monday of Jan, Apr, Jul, Oct at 09:00 UTC
    # Note: GitHub Actions doesn't natively support "first Monday of month"
    # so we schedule on the 1st-7th of each quarter month and filter in the job.
    - cron: '0 9 1-7 1,4,7,10 1'
  workflow_dispatch:
    inputs:
      drill_type:
        description: 'DR drill type to remind about'
        required: false
        default: 'quarterly'

permissions:
  issues: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  create-drill-reminder:
    name: Create DR Drill Reminder Issue
    runs-on: ubuntu-latest
    steps:
      # cron ORs day-of-month with day-of-week when both are restricted, so
      # '0 9 1-7 1,4,7,10 1' fires on the 1st-7th AND on every Monday of those
      # months, not on the first Monday. The header comment claimed this was
      # "filtered in the job", but no filter was ever implemented, which produced
      # ten duplicate issues for 2026-Q3 alone. Filter here for real.
      - name: Skip unless today is the first Monday of the quarter month
        id: gate
        run: |
          DOM=$(date -u +%-d)
          DOW=$(date -u +%u)   # 1 = Monday
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "manual dispatch — bypassing the first-Monday gate"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          elif [ "$DOW" -eq 1 ] && [ "$DOM" -le 7 ]; then
            echo "first Monday (dom=${DOM}) — proceeding"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "not the first Monday (dom=${DOM} dow=${DOW}) — no reminder today"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine quarter and drill type
        id: quarter
        if: steps.gate.outputs.proceed == 'true'
        run: |
          MONTH=$(date +%-m)
          YEAR=$(date +%Y)
          if   [ "$MONTH" -le 3 ];  then Q=1; DRILL="Vercel → Cloudflare Pages cutover drill"
          elif [ "$MONTH" -le 6 ];  then Q=2; DRILL="R2 backup full-restore drill (Postgres → staging)"
          elif [ "$MONTH" -le 9 ];  then Q=3; DRILL="Hasura migration tabletop drill"
          else                           Q=4; DRILL="Hetzner → OVH/AWS failover live drill"
          fi
          echo "quarter=Q${Q}" >> $GITHUB_OUTPUT
          echo "drill=${DRILL}" >> $GITHUB_OUTPUT
          echo "year=${YEAR}" >> $GITHUB_OUTPUT

      - name: Create reminder issue
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const { quarter, drill, year } = {
              quarter: '${{ steps.quarter.outputs.quarter }}',
              drill: '${{ steps.quarter.outputs.drill }}',
              year: '${{ steps.quarter.outputs.year }}'
            };

            const title = `DR Drill ${year}-${quarter}: ${drill}`;

            // Second line of defence: even if the schedule fires more than once,
            // never open a duplicate while a reminder for this quarter is open.
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'dr-drill',
              per_page: 100,
            });
            const dupe = existing.find(i => i.title === title);
            if (dupe) {
              core.notice(`Reminder already open as #${dupe.number} — not creating a duplicate.`);
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: [
                '## Quarterly DR Drill Reminder',
                '',
                `**Quarter:** ${year}-${quarter}`,
                `**Drill:** ${drill}`,
                '',
                '### Instructions',
                '',
                '1. Read the runbook: `.claude/docs/operations/dr-drills-calendar.md`',
                '2. Schedule a 2-hour window with the team',
                '3. Execute the drill using the template in the calendar doc',
                '4. Record the result in the drill log',
                '5. File any gaps found as follow-up issues',
                '',
                '### Runbook Location',
                '',
                'All runbooks are in `.claude/docs/operations/`. Relevant for this drill:',
                '- Q1: `vercel-failover-runbook.md`',
                '- Q2: `postgres-restore-drill.md`',
                '- Q3: `hasura-migration-runbook.md`',
                '- Q4: `hetzner-failover-runbook.md`',
                '',
                '### Success Criteria',
                '',
                'See `dr-drills-calendar.md` § Quarterly Schedule for pass/fail criteria.',
                '',
                '---',
                '*Auto-created by [DR Drill Quarterly Reminder workflow](.github/workflows/dr-drill-reminder.yml)*'
              ].join('\n'),
              labels: ['ops', 'dr-drill', 'quarterly']
            });

name: Publish nChat SDK to npm

# Triggers on:
#   - cli release tag (v*)             — publishes SDK in lockstep with CLI
#   - sdk-scoped tag (cli-sdk-nchat/v*) — publishes SDK only (out-of-band patches)

on:
  push:
    tags:
      - 'v*'
      - 'cli-sdk-nchat/v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.0.13). Overrides package.json if set.'
        required: false
        type: string

jobs:
  publish:
    # Skip gracefully when the nchat SDK directory does not yet exist in this repo.
    # Remove this guard once sdk/chat/ (or nchat/) is scaffolded.
    if: hashFiles('nchat/package.json') != ''
    name: Publish @nself/nchat to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Override version (workflow_dispatch only)
        if: ${{ inputs.version != '' }}
        run: |
          cd nchat
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${{ inputs.version }}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Install dependencies
        run: |
          cd nchat
          pnpm install --no-frozen-lockfile

      - name: Build
        run: |
          cd nchat
          pnpm build

      - name: Publish to npm (with provenance, skip-existing, retry up to 3x)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
        run: |
          cd nchat
          # If the version on npm already matches, skip without failing.
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "${PKG}@${VER}" version >/dev/null 2>&1; then
            echo "${PKG}@${VER} already published, skipping."
            exit 0
          fi
          # Bounded retry: 3 attempts, exponential backoff starting at 30s.
          attempt=1
          delay=30
          until pnpm publish --access public --no-git-checks --provenance; do
            if [ "$attempt" -ge 3 ]; then
              echo "Publish failed after $attempt attempts."
              exit 1
            fi
            echo "Attempt $attempt failed. Retrying in ${delay}s..."
            sleep "$delay"
            attempt=$((attempt + 1))
            delay=$((delay * 2))
          done

---
name: Publish TypeScript SDK to npm

# Triggers on:
#   - cli release tag (v*)            -- publishes SDK in lockstep with CLI
#   - sdk-scoped tag (cli-sdk-ts/v*)  -- publishes SDK only (out-of-band)
#   - workflow_dispatch               -- manual publish with version input

"on":
  push:
    tags:
      - 'v*'
      - 'cli-sdk-ts/v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Publish version (e.g. 1.0.13). Blank = use package.json.'
        required: false
        type: string

jobs:
  # No-op guard: branch pushes should not trigger publish.  This job runs only
  # on branch pushes (not tag pushes or dispatch) and exits success immediately,
  # preventing GitHub from recording a 0-job failure run when a branch push
  # coincidentally matches the workflow's push trigger evaluation.
  branch-push-noop:
    name: No-op (branch push — publish requires a tag or workflow_dispatch)
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Skip — publish is tag/dispatch-only
        run: echo "SDK publish is tag-triggered or workflow_dispatch-only. No action on branch push."

  publish:
    # Skip gracefully when the TypeScript SDK directory does not yet exist.
    if: hashFiles('sdk/ts/package.json') != ''
    name: Publish @nself/sdk-ts to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Override version (workflow_dispatch only)
        if: ${{ inputs.version != '' }}
        run: |
          cd sdk/ts
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${{ inputs.version }}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Install dependencies
        run: |
          cd sdk/ts
          pnpm install --no-frozen-lockfile

      - name: Build
        run: |
          cd sdk/ts
          pnpm build

      - name: Publish to npm (with provenance, skip-existing, retry up to 3x)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd sdk/ts
          # If the version on npm already matches, skip without failing.
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "${PKG}@${VER}" version >/dev/null 2>&1; then
            echo "${PKG}@${VER} already published, skipping."
            exit 0
          fi
          # Bounded retry: 3 attempts, exponential backoff starting at 30s.
          attempt=1
          delay=30
          until pnpm publish --access public --no-git-checks --provenance; do
            if [ "$attempt" -ge 3 ]; then
              echo "Publish failed after $attempt attempts."
              exit 1
            fi
            echo "Attempt $attempt failed. Retrying in ${delay}s..."
            sleep "$delay"
            attempt=$((attempt + 1))
            delay=$((delay * 2))
          done

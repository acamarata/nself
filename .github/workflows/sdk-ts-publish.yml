name: Publish TypeScript SDK to npm

# Triggers on:
#   - cli release tag (v*)             — publishes SDK in lockstep with CLI
#   - sdk-scoped tag (cli-sdk-ts/v*)   — publishes SDK only (out-of-band patches)

on:
  push:
    tags:
      - 'v*'
      - 'cli-sdk-ts/v*'
  workflow_dispatch:

jobs:
  publish:
    name: Publish @nself/plugin-sdk to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: |
          cd cli/sdk/ts
          pnpm install --no-frozen-lockfile

      - name: Build
        run: |
          cd cli/sdk/ts
          pnpm build

      - name: Publish to npm (with provenance, skip-existing)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd cli/sdk/ts
          # If the version on npm already matches, skip without failing.
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "${PKG}@${VER}" version >/dev/null 2>&1; then
            echo "${PKG}@${VER} already published, skipping."
            exit 0
          fi
          pnpm publish --access public --no-git-checks --provenance

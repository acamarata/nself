name: Flutter SDK PR Gate

# Runs dart pub publish --dry-run on every PR that touches cli/sdk/flutter/**
# This validates the package before merge — no actual publish occurs.

on:
  pull_request:
    paths:
      - 'cli/sdk/flutter/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dry-run:
    name: Validate Flutter SDK (dry run)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: |
          cd cli/sdk/flutter
          flutter pub get

      - name: Dry run publish check
        run: |
          cd cli/sdk/flutter
          dart pub publish --dry-run

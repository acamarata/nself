name: Publish Flutter SDK to pub.dev

# Triggers on:
#   - cli release tag (v*)                  — publishes SDK in lockstep with CLI
#   - sdk-scoped tag (cli-sdk-flutter/v*)   — publishes SDK only (out-of-band patches)
#
# pub.dev OIDC publishing is preferred (no long-lived token needed).
# If your repo is allowlisted in pub.dev's "Automated publishing" settings,
# the id-token permission below is sufficient and PUB_DEV_TOKEN is unused.
# Otherwise, PUB_DEV_TOKEN holds a short-lived auth credential.

on:
  push:
    tags:
      - 'v*'
      - 'cli-sdk-flutter/v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.0.13). Leave blank to use pubspec.yaml version.'
        required: false
        type: string

jobs:
  publish:
    name: Publish nself_sdk to pub.dev
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Override version (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        run: |
          cd sdk/flutter
          # Update version field in pubspec.yaml
          sed -i "s/^version: .*/version: ${{ inputs.version }}/" pubspec.yaml

      - name: Install dependencies
        run: |
          cd sdk/flutter
          flutter pub get

      - name: Dry run (analyzer + publish check)
        run: |
          cd sdk/flutter
          flutter pub publish --dry-run

      - name: Publish to pub.dev (retry up to 3x, exponential backoff starting 30s)
        env:
          PUB_DEV_CREDENTIALS_JSON: ${{ secrets.PUB_DEV_CREDENTIALS_JSON }}
        run: |
          cd sdk/flutter
          attempt=1
          delay=30
          until flutter pub publish --force; do
            if [ "$attempt" -ge 3 ]; then
              echo "Publish failed after $attempt attempts."
              exit 1
            fi
            echo "Attempt $attempt failed. Retrying in ${delay}s..."
            sleep "$delay"
            attempt=$((attempt + 1))
            delay=$((delay * 2))
          done

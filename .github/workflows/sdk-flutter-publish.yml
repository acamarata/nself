name: Publish Flutter SDK to pub.dev

on:
  push:
    tags:
      - 'cli-sdk-flutter/v*'

jobs:
  publish:
    name: Publish nself_sdk to pub.dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: |
          cd sdk/flutter
          flutter pub get

      - name: Publish to pub.dev
        run: |
          cd sdk/flutter
          flutter pub publish --force
        env:
          PUB_DEV_PUBLISH_ACCESS_TOKEN: ${{ secrets.PUB_DEV_TOKEN }}

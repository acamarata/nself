name: Trivy Container Scan

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile*"
      - "go.mod"
      - "go.sum"
  pull_request:
    paths:
      - "Dockerfile*"

permissions:
  contents: read
  security-events: write
  issues: write

jobs:
  trivy:
    name: Trivy scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary for container context
        run: CGO_ENABLED=0 GOOS=linux go build -mod=vendor -o nself ./apps/nself/

      - name: Trivy filesystem scan (source + deps)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0"

      - name: Check for critical vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL
          exit-code: "1"

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: trivy-fs.sarif
          category: trivy

      - name: Create issue for HIGH findings
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Trivy: Critical vulnerability found (${new Date().toISOString().split('T')[0]})`,
              body: `Trivy scan found CRITICAL vulnerabilities on \`main\`. Check the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.`,
              labels: ['security']
            });

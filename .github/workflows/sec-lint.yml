name: Security Lint

on:
  push:
    branches: [main]
    paths: &sec-lint-paths
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "scripts/sec-lint.sh"
      - ".github/workflows/sec-lint.yml"
  pull_request:
    paths: *sec-lint-paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sec-lint:
    name: Security Lint (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Run security lint
        run: bash scripts/sec-lint.sh internal

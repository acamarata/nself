# Dependabot — GitHub Actions version pinning + Go module CVE tracking + npm SDK tracking
# S44-T-SEC-01: keep Actions SHA-pinned via Dependabot PRs.
# P4-E5-W3-S05-T17: gomod ecosystem added for automated Go CVE detection.
# P6-E11-W2-S3-T16 (row 16): npm ecosystem added for sdk/ts + sdk/ts-sdk — the
# two TS SDK packages with their own package.json were previously untracked.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: 'ci'
      include: scope

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: daily
      time: '04:00'
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - go
    commit-message:
      prefix: 'chore(deps)'
      include: scope
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major

  - package-ecosystem: npm
    directory: /sdk/ts
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: 'chore(deps)'
      include: scope
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major

  - package-ecosystem: npm
    directory: /sdk/ts-sdk
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: 'chore(deps)'
      include: scope
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major

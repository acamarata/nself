title = "nSelf CLI gitleaks config"

[extend]
useDefault = true

[[allowlist.paths]]
description = "Test files — mock credentials are intentional test vectors"
paths = [
  '''.*_test\.go''',
  '''test/''',
  '''testdata/''',
]

[[allowlist.paths]]
description = "Example and template env files — placeholder values only"
paths = [
  '''internal/config/\.env\.example''',
  '''cmd/commands/\.env\.example''',
  '''\.env\.example$''',
  '''\.example\.env$''',
  '''\.env\.template$''',
]

[[allowlist.paths]]
description = "Migration fixtures — test database state"
paths = [
  '''internal/migration/testdata/''',
]

[[allowlist.paths]]
description = "Wiki and documentation — example values in docs"
paths = [
  '''\.github/wiki/''',
  '''\.github/docs/''',
  '''\.claude/''',
]

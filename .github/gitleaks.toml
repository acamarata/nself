title = "nSelf CLI gitleaks config"

[extend]
useDefault = true

[allowlist]
paths = [
  # Test files — mock credentials are intentional test vectors
  '''.*_test\.go''',
  '''test/''',
  '''testdata/''',
  # Example and template env files — placeholder values only
  '''internal/config/\.env\.example''',
  '''cmd/commands/\.env\.example''',
  '''\.env\.example$''',
  '''\.example\.env$''',
  '''\.env\.template$''',
  # Migration fixtures — test database state
  '''internal/migration/testdata/''',
  # Wiki and documentation — example values in docs
  '''\.github/wiki/''',
  '''\.github/docs/''',
  '''\.claude/''',
]

name: Bug Report
description: Something isn't working
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: nSelf version
      placeholder: Run `nself version` and paste output
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux (Ubuntu/Debian)
        - Linux (Other)
    validations:
      required: true
  - type: input
    id: docker_version
    attributes:
      label: Docker version
      placeholder: Run `docker --version` and paste output
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `nself ...`
        2. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Run `nself logs` or `nself doctor` and paste relevant output
      render: shell

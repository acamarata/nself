version: 2

project_name: nself

builds:
  - id: nself
    main: ./cmd/nself/
    binary: nself
    env:
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -mod=vendor
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/nself-org/cli/internal/version.Version={{ .Version }}
      - -X github.com/nself-org/cli/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/nself-org/cli/internal/version.BuildDate={{ .Date }}
      - -X github.com/nself-org/cli/internal/license.licensePubKeyHex={{ .Env.NSELF_LICENSE_PUBKEY_HEX }}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    format: tar.gz
    name_template: "{{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt
  algorithm: sha256

release:
  github:
    owner: nself-org
    name: cli
  draft: false
  prerelease: auto

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

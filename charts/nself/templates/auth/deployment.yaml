apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-auth
  labels:
    app.kubernetes.io/name: auth
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.auth.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: auth
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: auth
          image: {{ .Values.auth.image }}
          env:
            - name: AUTH_SERVER_URL
              value: https://{{ .Values.domain }}/v1/auth
            - name: HASURA_GRAPHQL_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgres
                  key: database-url
            - name: HASURA_GRAPHQL_ADMIN_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-hasura
                  key: admin-secret
            - name: HASURA_GRAPHQL_GRAPHQL_URL
              value: http://{{ .Release.Name }}-hasura:8080/v1/graphql
          ports:
            - containerPort: 4000
              name: http
          resources:
            {{- toYaml .Values.auth.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 5

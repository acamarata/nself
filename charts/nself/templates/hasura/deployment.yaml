apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-hasura
  labels:
    app.kubernetes.io/name: hasura
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.hasura.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: hasura
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hasura
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: hasura
          image: {{ .Values.hasura.image }}
          env:
            - name: HASURA_GRAPHQL_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgres
                  key: database-url
            - name: HASURA_GRAPHQL_ADMIN_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-hasura
                  key: admin-secret
            - name: HASURA_GRAPHQL_ENABLE_CONSOLE
              value: "false"
            - name: HASURA_GRAPHQL_ENABLED_LOG_TYPES
              value: startup,http-log,webhook-log,websocket-log,query-log
          ports:
            - containerPort: 8080
              name: http
          resources:
            {{- toYaml .Values.hasura.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5

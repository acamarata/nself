---
name: Publish Flutter SDK

# Triggers on:
#   - sdk-scoped tag (sdk-flutter/v*)  -- publishes nself_plugin_sdk to pub.dev
#   - workflow_dispatch               -- manual publish with version input
#
# Publishes to https://pub.dev/packages/nself_plugin_sdk
# Requires PUB_DEV_CREDENTIALS secret (JSON from `dart pub token add` / pub.dev OAuth).
# See: https://dart.dev/tools/pub/publishing#automated-publishing

"on":
  push:
    tags:
      - 'sdk-flutter/v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Publish version (e.g. 2.0.0). Used for release notes only.'
        required: false
        type: string

permissions:
  id-token: write   # reserved for future pub.dev OIDC trusted publisher support
                    # pub.dev does not yet support OIDC keyless publishing (as of 2026);
                    # the PUB_DEV_CREDENTIALS secret is still required.
                    # Track: https://github.com/dart-lang/pub-dev/issues/6687
  contents: write   # required to create GitHub release

jobs:
  publish:
    name: Publish nself_plugin_sdk
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: stable

      - name: Derive version from tag
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/sdk-flutter/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/sdk-flutter/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        working-directory: sdk/flutter
        run: flutter pub get

      - name: Analyze
        working-directory: sdk/flutter
        run: flutter analyze --no-pub

      - name: Test
        working-directory: sdk/flutter
        run: flutter test

      - name: Verify pubspec version matches tag
        working-directory: sdk/flutter
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          PKG_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          if [ "v${PKG_VERSION}" != "${TAG}" ]; then
            echo "ERROR: pubspec.yaml version 'v${PKG_VERSION}' does not match tag '${TAG}'"
            exit 1
          fi
          echo "Version check passed: ${TAG}"

      - name: Publish to pub.dev
        working-directory: sdk/flutter
        run: dart pub publish --force
        env:
          PUB_DEV_CREDENTIALS: ${{ secrets.PUB_DEV_CREDENTIALS }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          FULL_TAG="sdk-flutter/${TAG}"
          NOTES=$(git tag -l --format='%(contents)' "${FULL_TAG}" 2>/dev/null || echo "Flutter SDK ${TAG} release.")
          gh release create "${FULL_TAG}" \
            --title "Flutter SDK ${TAG}" \
            --notes "${NOTES}" \
            --verify-tag

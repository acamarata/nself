name: nself_sdk
description: "Flutter SDK for nSelf. Auth, GraphQL, storage, realtime, functions, and push."
version: 1.0.13

homepage: https://nself.org
repository: https://github.com/nself-org/cli
issue_tracker: https://github.com/nself-org/cli/issues

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  web_socket_channel: ^2.4.0
  json_annotation: ^4.9.0
  flutter_secure_storage: ^9.0.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mockito: ^5.4.0
  build_runner: ^2.4.0
  json_serializable: ^6.8.0

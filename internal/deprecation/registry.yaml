  # CLI-R19. `uninstall` stays registered (hidden) rather than being rewritten:
  # bare `uninstall` keeps database volumes while bare `reset` removes them, so
  # a blanket redirect would turn a safe habit into data loss. The replacement
  # named here is the flag that matches what `uninstall` actually did.
  - name: "nself uninstall"
    type: command
    since: "v1.2.8"
    replacement: "nself reset --keep-data (or --purge for the full wipe)"
    docs_url: "https://nself.org/docs/cli/reset"
    phase: 1

  # CLI-R11 thin-core extraction, first slice. Unlike the phase-1 entries
  # above, `dogfood` has no new home inside core — it moved to a plugin
  # entirely, so there is no argv rewrite in cmd/commands/legacy_spellings.go
  # for it. Once cmd/commands/dogfood.go is deleted, `nself dogfood` becomes
  # an unrecognized top-level command and root.go's Execute() routes it
  # straight to internal/plugin.ProxyCommand — which prints its own
  # "unknown command ... install it with: nself install dogfood" message
  # BEFORE cobra ever reaches PersistentPreRunE, so this registry entry is
  # not consulted by the current code path. It is recorded here so the
  # replacement text is pinned and reviewable, and so a future wiring of
  # ProxyCommand into the deprecation registry (tracked as a CLI-R11 follow-up,
  # not part of this ticket) has a single source of truth to read from. The
  # wording below intentionally matches ProxyCommand's own hint so the two
  # never contradict even though only one of them is reachable today.
  - name: "nself dogfood"
    type: command
    since: "v1.2.8"
    replacement: "nself install dogfood"
    docs_url: "https://nself.org/docs/plugins/dogfood"
    # Phase 1, not 3. Phase 3 means "removed", and the deprecation-cycle
    # workflow rightly refuses a jump straight to it without a prior warning
    # release. But it is also the wrong classification: a CLI-R11 extraction
    # RELOCATES a command, it does not delete it. `nself dogfood ...` works
    # exactly as before once `nself install dogfood` has run, which is what
    # phase 1 describes.
    phase: 1

  # CLI-R11 thin-core extraction. Same reasoning as `nself dogfood` above:
  # relocated to a plugin, not removed, so phase 1 (not 3). This entry IS
  # live on the proxy path: since commit bb083973 wired warnRelocatedCommand
  # into root.go's Execute(), an unrecognized `nself k8s` prints this entry's
  # [DEPRECATED] notice before plugin.ProxyCommand ever runs. See
  # TestRelocatedCommandEntriesAreWiredToTheProxy.
  - name: "nself k8s"

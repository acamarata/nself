# nSelf CLI + Plugin Deprecation Registry
# Read at startup by internal/deprecation.LoadRegistry() (CLI items)
# and internal/deprecation.LoadPluginRegistry() (plugin API items).
#
# CLI Schema (items[]):
#   name:        string   # CLI command/flag name (e.g. "nself old-cmd" or "--old-flag")
#   type:        string   # "command" | "flag" | "env"
#   since:       string   # Version when deprecation started (e.g. "v1.0.9")
#   replacement: string   # What to use instead
#   docs_url:    string   # Docs link for migration
#   phase:       integer  # 1 = warning, 2 = strong warning, 3 = removed
#
# Plugin API Schema (plugins[]):
#   name:               string   # plugin name (e.g. "ai")
#   api_version:        string   # current SemVer of the plugin's HTTP API (G2)
#   deprecated_endpoints[]:      # (G4) may be empty []
#     path:             string   # e.g. /v1/complete
#     deprecated_in:    string   # SemVer when this path was deprecated
#     removed_in:       string   # SemVer when this path will be removed
#     replacement:      string   # path or description of replacement
#     reason:           string   # human-readable rationale
#
# v1.0.9 LTS baseline: no CLI command deprecations.
# v1.0.9 LTS baseline: no plugin endpoint deprecations (all paths are current).

# =============================================================================
# CLI deprecations
# =============================================================================

items:
  # nMedia bundle → nTV bundle (bundle name change, not a CLI command — listed here for reference)
  - name: "nMedia bundle"
    type: env
    since: "v1.0.9"
    replacement: "nTV bundle — run: nself plugin install nTV"
    docs_url: "https://docs.nself.org/migrate/v1-0-8-to-v1-0-9"
    phase: 1

# =============================================================================
# Plugin API versioning — G2 (api_version), G4 (deprecated_endpoints + removal)
# =============================================================================
#
# All 74 plugins in plugins-pro/paid/ are listed below.
# api_version reflects the current stable API version as of v1.0.9 LTS.
# deprecated_endpoints is empty for all plugins at v1.0.9 baseline (no removals planned).
#
# IMPORTANT: when adding a new deprecated endpoint, follow the lifecycle:
#   1. Add entry with deprecated_in = current_version, removed_in = next major
#   2. The plugin HTTP handler must inject Deprecation + Sunset headers (G5)
#   3. Bump api_version (MINOR if adding replacement, MAJOR if removing)
#   4. Update the public registry at ping.nself.org/api/deprecation-registry.json (G8)
# =============================================================================

plugins:

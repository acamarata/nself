# nSelf CLI + Plugin Deprecation Registry
# Compiled into the binary via go:embed (internal/deprecation/embedded.go) and read
# at startup by LoadEmbeddedRegistry() (CLI items) and LoadPluginRegistry()
# (plugin API items). Override for previews/tests with NSELF_DEPRECATION_REGISTRY.
#
# CLI Schema (items[]):
#   name:        string   # CLI command/flag name (e.g. "nself old-cmd" or "--old-flag")
#   type:        string   # "command" | "flag" | "env"
#   since:       string   # Version when deprecation started (e.g. "v1.0.9")
#   replacement: string   # What to use instead
#   docs_url:    string   # Docs link for migration
#   phase:       integer  # 1 = warning, 2 = strong warning, 3 = removed
#
# Plugin API Schema (plugins[]):
#   name:               string   # plugin name (e.g. "ai")
#   api_version:        string   # current SemVer of the plugin's HTTP API (G2)
#   deprecated_endpoints[]:      # (G4) may be empty []
#     path:             string   # e.g. /v1/complete
#     deprecated_in:    string   # SemVer when this path was deprecated
#     removed_in:       string   # SemVer when this path will be removed
#     replacement:      string   # path or description of replacement
#     reason:           string   # human-readable rationale
#
# v1.0.9 LTS baseline: no CLI command deprecations.
# v1.0.9 LTS baseline: no plugin endpoint deprecations (all paths are current).

# =============================================================================
# CLI deprecations
# =============================================================================

items:
  # nMedia bundle → nTV bundle (bundle name change, not a CLI command — listed here for reference)
  - name: "nMedia bundle"
    type: env
    since: "v1.0.9"
    replacement: "nTV bundle — run: nself plugin install nTV"
    docs_url: "https://nself.org/docs/migrate/v1-0-8-to-v1-0-9"
    phase: 1

  # Legacy hidden aliases kept for pre-v1 muscle memory (cmd/commands/aliases.go).
  # They keep working; the warning points at the canonical spelling.
  - name: "nself up"
    type: command
    since: "v1.2.8"
    replacement: "nself start"
    docs_url: "https://nself.org/docs/cli/start"
    phase: 1

  - name: "nself down"
    type: command
    since: "v1.2.8"
    replacement: "nself stop"
    docs_url: "https://nself.org/docs/cli/stop"
    phase: 1

  # CLI-R09 consolidation. Every old spelling still works: cmd/commands/
  # legacy_spellings.go rewrites argv onto the canonical path, so flags and
  # positional arguments behave identically.
  - name: "nself release-check"
    type: command
    since: "v1.2.8"
    replacement: "nself release check"
    docs_url: "https://nself.org/docs/cli/release"
    phase: 1

  - name: "nself release-rollback"
    type: command
    since: "v1.2.8"
    replacement: "nself release rollback"
    docs_url: "https://nself.org/docs/cli/release"
    phase: 1

  - name: "nself release-status"
    type: command
    since: "v1.2.8"
    replacement: "nself release status"
    docs_url: "https://nself.org/docs/cli/release"
    phase: 1

  - name: "nself migrate-from-v099"
    type: command
    since: "v1.2.8"
    replacement: "nself migrate from-v099"
    docs_url: "https://nself.org/docs/migrate/from-v0.9"
    phase: 1

  - name: "nself dns-setup"
    type: command
    since: "v1.2.8"
    replacement: "nself trust dns"
    docs_url: "https://nself.org/docs/cli/trust"
    phase: 1

  - name: "nself ollama"
    type: command
    since: "v1.2.8"
    replacement: "nself model ollama"
    docs_url: "https://nself.org/docs/cli/model"
    phase: 1

  - name: "nself feature"
    type: command
    since: "v1.2.8"
    replacement: "nself config features"
    docs_url: "https://nself.org/docs/cli/config"
    phase: 1

  - name: "nself pitr"
    type: command
    since: "v1.2.8"
    replacement: "nself backup pitr"
    docs_url: "https://nself.org/docs/cli/backup"
    phase: 1

  - name: "nself flag"
    type: command
    since: "v1.2.8"
    replacement: "nself flags"
    docs_url: "https://nself.org/docs/cli/flags"
    phase: 1

  # CLI-R19. `uninstall` stays registered (hidden) rather than being rewritten:
  # bare `uninstall` keeps database volumes while bare `reset` removes them, so
  # a blanket redirect would turn a safe habit into data loss. The replacement
  # named here is the flag that matches what `uninstall` actually did.
  - name: "nself uninstall"
    type: command
    since: "v1.2.8"
    replacement: "nself reset --keep-data (or --purge for the full wipe)"
    docs_url: "https://nself.org/docs/cli/reset"
    phase: 1

  # CLI-R11 thin-core extraction, first slice. Unlike the phase-1 entries
  # above, `dogfood` has no new home inside core — it moved to a plugin
  # entirely, so there is no argv rewrite in cmd/commands/legacy_spellings.go
  # for it. Once cmd/commands/dogfood.go is deleted, `nself dogfood` becomes
  # an unrecognized top-level command and root.go's Execute() routes it
  # straight to internal/plugin.ProxyCommand — which prints its own
  # "unknown command ... install it with: nself install dogfood" message
  # BEFORE cobra ever reaches PersistentPreRunE, so this registry entry is
  # not consulted by the current code path. It is recorded here so the
  # replacement text is pinned and reviewable, and so a future wiring of
  # ProxyCommand into the deprecation registry (tracked as a CLI-R11 follow-up,
  # not part of this ticket) has a single source of truth to read from. The
  # wording below intentionally matches ProxyCommand's own hint so the two
  # never contradict even though only one of them is reachable today.
  - name: "nself dogfood"
    type: command
    since: "v1.2.8"
    replacement: "nself install dogfood"
    docs_url: "https://nself.org/docs/plugins/dogfood"
    # Phase 1, not 3. Phase 3 means "removed", and the deprecation-cycle
    # workflow rightly refuses a jump straight to it without a prior warning
    # release. But it is also the wrong classification: a CLI-R11 extraction
    # RELOCATES a command, it does not delete it. `nself dogfood ...` works
    # exactly as before once `nself install dogfood` has run, which is what
    # phase 1 describes.
    phase: 1

  # CLI-R11 thin-core extraction. Same shape as `nself dogfood` above: moved
  # to a plugin entirely, not rewritten to a new core subcommand, so this
  # entry is not consulted by the current ProxyCommand code path (see the
  # dogfood entry's comment for the full explanation). Phase 1, not 3, for
  # the same reason: the command is relocated, not removed.
  - name: "nself encryption"
    type: command
    since: "v1.2.8"
    replacement: "nself install encryption"
    docs_url: "https://nself.org/docs/plugins/encryption"
    phase: 1

# =============================================================================
# Plugin API versioning — G2 (api_version), G4 (deprecated_endpoints + removal)
# =============================================================================
#
# All 74 plugins in plugins-pro/paid/ are listed below.
# api_version reflects the current stable API version as of v1.0.9 LTS.
# deprecated_endpoints is empty for all plugins at v1.0.9 baseline (no removals planned).
#
# IMPORTANT: when adding a new deprecated endpoint, follow the lifecycle:
#   1. Add entry with deprecated_in = current_version, removed_in = next major
#   2. The plugin HTTP handler must inject Deprecation + Sunset headers (G5)
#   3. Bump api_version (MINOR if adding replacement, MAJOR if removing)
#   4. Update the public registry at ping.nself.org/api/deprecation-registry.json (G8)
# =============================================================================


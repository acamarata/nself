# NSELF-FIRST EXCEPTION: cli-internal-template — generator template, not user-edited
# nSelf Monitoring Stack
# Generated by: nself build --monitoring
# All 10 monitoring services for production observability.
#
# This file is a SOURCE TEMPLATE bundled inside the nself CLI binary.
# The nself CLI generates the final version via `nself build` when monitoring
# is enabled in .env (MONITORING_ENABLED=true).
#
# WRONG: docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
# RIGHT: nself build && nself start

services:
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: ${PROJECT_NAME}_prometheus
    restart: unless-stopped
    volumes:
      - prometheus_data:/prometheus
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    networks:
      - nself_network
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:11.1.0
    container_name: ${PROJECT_NAME}_grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - nself_network
    ports:
      - "127.0.0.1:3000:3000"

  loki:
    image: grafana/loki:3.1.0
    container_name: ${PROJECT_NAME}_loki
    restart: unless-stopped
    volumes:
      - loki_data:/loki
      - ./monitoring/loki.yml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - nself_network
    ports:
      - "127.0.0.1:3100:3100"

  promtail:
    image: grafana/promtail:3.1.0
    container_name: ${PROJECT_NAME}_promtail
    restart: unless-stopped
    volumes:
      - /var/log:/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./monitoring/promtail.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - nself_network

  tempo:
    image: grafana/tempo:2.5.0
    container_name: ${PROJECT_NAME}_tempo
    restart: unless-stopped
    volumes:
      - tempo_data:/var/tempo
      - ./monitoring/tempo.yml:/etc/tempo/config.yml:ro
    command: -config.file=/etc/tempo/config.yml
    networks:
      - nself_network
    ports:
      - "127.0.0.1:3200:3200"

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: ${PROJECT_NAME}_alertmanager
    restart: unless-stopped
    volumes:
      - alertmanager_data:/alertmanager
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    networks:
      - nself_network
    ports:
      - "127.0.0.1:9093:9093"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: ${PROJECT_NAME}_cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - nself_network
    ports:
      - "127.0.0.1:8080:8080"

  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: ${PROJECT_NAME}_node_exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    networks:
      - nself_network
    ports:
      - "127.0.0.1:9100:9100"

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: ${PROJECT_NAME}_postgres_exporter
    restart: unless-stopped
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nself_db}?sslmode=disable
    networks:
      - nself_network
    ports:
      - "127.0.0.1:9187:9187"

  redis-exporter:
    image: oliver006/redis_exporter:v1.61.0
    container_name: ${PROJECT_NAME}_redis_exporter
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis:6379
    networks:
      - nself_network
    ports:
      - "127.0.0.1:9121:9121"

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  tempo_data:
  alertmanager_data:

networks:
  nself_network:
    external: true
